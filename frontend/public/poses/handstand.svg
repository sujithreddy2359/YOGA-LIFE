<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a30"/>
      <stop offset="100%" stop-color="#11325c"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Ambient Center Glow -->
  <circle cx="400" cy="270" r="260" fill="url(#glowGrad)"/>

  <!-- Decorative Sacred Geometric Ring -->
  <circle cx="400" cy="270" r="190" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="400" cy="270" r="230" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2 12" opacity="0.3"/>

  <!-- Top Category & Stance Badge -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1.5">🙃 INVERSION</text>
  </g>

  <!-- Top Right Difficulty Badge -->
  <g transform="translate(620, 45)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Advanced</text>
  </g>

  <!-- Central Posture Figure Vector Graphic -->
  <g fill="none" stroke="#3b82f6" style="color: #3b82f6; filter: url(#shadow);">
    
        <line x1="400" y1="350" x2="400" y2="210" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
        <circle cx="400" cy="375" r="22" fill="currentColor"/>
        <path d="M 400 340 L 360 380 M 400 340 L 440 380" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
        
  </g>

  <!-- Chakra Energy Node Accents -->
  <circle cx="400" cy="270" r="6" fill="#60a5fa" opacity="0.9"/>
  <circle cx="400" cy="270" r="14" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>

  <!-- Bottom Information Bar -->
  <rect x="0" y="470" width="800" height="130" fill="#060c0a" fill-opacity="0.75"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Pose Title & Sanskrit Name -->
  <text x="50" y="522" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#ffffff">Handstand</text>
  <text x="50" y="555" font-family="system-ui, sans-serif" font-size="16" font-style="italic" fill="#60a5fa">Adho Mukha Vrksasana</text>

  <!-- Body Target Badge -->
  <g transform="translate(600, 508)">
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="75" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🎯 Arms</text>
  </g>
</svg>